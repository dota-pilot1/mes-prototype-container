services:
  postgres:
    image: postgres:15-alpine
    container_name: mes-prototype-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: mes_prototype
    ports:
      - "5434:5432"
    volumes:
      - mes_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mes_postgres_data:
    driver: local
